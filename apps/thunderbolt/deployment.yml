apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunderbolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunderbolt
  template:
    metadata:
      labels:
        app: thunderbolt
    spec:
      containers:
        - name: web
          image: ghcr.io/the-most-secure-supply-chain-ever-maaan/thunderbolt@sha256:59964baa96fa10a921b872a01cd7dc40d4d6d4d504c605a9b6ad8565bc4273af
          ports:
            - containerPort: 5731
---
apiVersion: v1
kind: Service
metadata:
  name: thunderbolt
spec:
  selector:
    app: thunderbolt
  ports:
    - port: 80
      targetPort: 5731 # nginx port
---

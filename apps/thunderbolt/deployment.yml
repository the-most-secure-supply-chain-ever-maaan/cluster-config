apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunderbolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunderbolt
  template:
    metadata:
      labels:
        app: thunderbolt
    spec:
      containers:
        - name: web
          image: ghcr.io/the-most-secure-supply-chain-ever-maaan/thunderbolt@sha256:0ba030b66ae627b567a419be1a6102188fe45a675f117be7f28e3b75c4e1c412
          ports:
            - containerPort: 5731
---
apiVersion: v1
kind: Service
metadata:
  name: thunderbolt
spec:
  selector:
    app: thunderbolt
  ports:
    - port: 80
      targetPort: 5731 # nginx port
---
